[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erc8128"
version = "0.2.0"
description = "Python implementation of ERC-8128 signing and verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.12.5,<3"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["erc8128*"]
